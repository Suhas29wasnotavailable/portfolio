<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Suhas — Computer Science student based in Bengaluru, India. AI systems, software and artwork."
    />
    <meta name="theme-color" content="#050508" />
    <title>Suhas Y — Portfolio</title>
    <style>
      /* Painted before any JS/CSS loads — prevents a flash of the wrong theme. */
      html,
      body {
        background: #050508;
      }
      html[data-theme='light'],
      html[data-theme='light'] body {
        background: #f4f3ee;
      }
    </style>
    <script>
      /* Apply the saved theme before first paint (defaults to dark). */
      (function () {
        try {
          var t = localStorage.getItem('theme');
          document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
